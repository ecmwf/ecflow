<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Marks a server configured for HTTP.

  The HTTP tags use a wireframe globe rather than the shield of the TCP/IP tags, so that the two
  families of protocol are told apart by shape before colour is even read. This one is black and
  carries no lock: HTTP offers no transport protection.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" version="1.1">
  <defs>
    <linearGradient id="httpBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="23" fill="url(#httpBadge)" stroke="#000000" stroke-width="4"/>
  <g fill="none" stroke="#000000" stroke-width="3.5">
    <ellipse cx="32" cy="32" rx="11" ry="23"/>
    <path d="M 9 32 H 55"/>
  </g>
</svg>
