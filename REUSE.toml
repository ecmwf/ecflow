version = 1
SPDX-PackageName = "ecflow"
SPDX-PackageSupplier = "European Centre for Medium-Range Weather Forecasts (ECMWF) <software.support@ecmwf.int>"
SPDX-PackageDownloadLocation = "https://github.com/ecmwf/ecflow"

# This file covers the content that cannot carry an SPDX header, either because
# the format has no comment syntax, or because a header would be read as data.
# An in-file header always takes precedence over an entry here, so a broad path
# below does not override a file that states its own licensing.

# ----------------------------------------------------------------------------
# ECMWF-authored content
# ----------------------------------------------------------------------------

# Images, diagrams and other assets accompanying the documentation. The
# reStructuredText sources carry their own headers; this entry also acts as a
# backstop for them.
[[annotations]]
path = "docs/**"
SPDX-FileCopyrightText = "2009- European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# Test fixtures, definition files, generated reference output and migration
# data. Several of these are compared byte for byte, so none may carry a
# header.
[[annotations]]
path = ["libs/**/test/**", "libs/test/**", "libs/pyext/migrate/**"]
SPDX-FileCopyrightText = "2009- European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# Qt Designer forms, resource collections and icons. The forms and resource
# files are XML that Qt regenerates, and the icons are binary.
[[annotations]]
path = ["Viewer/**.ui", "Viewer/**.qrc", "Viewer/ecflowUI/images/**"]
SPDX-FileCopyrightText = "2009- European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# Installed configuration, style sheets and sounds. The JSON files have no
# comment syntax, and shortcuts.txt is rendered verbatim in the user interface.
[[annotations]]
path = "share/**"
SPDX-FileCopyrightText = "2009- European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# Files whose format offers no comment syntax, or whose content is read
# verbatim.
[[annotations]]
path = ["CMakePresets.json", "NOTICE", "**/.gitignore", ".gitignore",
        "libs/pyext/samples/api/README"]
SPDX-FileCopyrightText = "2009- European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# ----------------------------------------------------------------------------
# Third-party content: original licensing, never re-stamped (ADR-010, clause 7)
# ----------------------------------------------------------------------------

[[annotations]]
path = "3rdparty/cereal/**"
SPDX-FileCopyrightText = "2014- Randolph Voorhies, Shane Grant and contributors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "3rdparty/cpp-httplib/**"
SPDX-FileCopyrightText = "2017- Yuji Hirose"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "3rdparty/json/**"
SPDX-FileCopyrightText = "2013- Niels Lohmann"
SPDX-License-Identifier = "MIT"

# LazyTextEdit, vendored outside 3rdparty/. The files ECMWF added to this
# directory carry their own headers and are unaffected by this entry.
[[annotations]]
path = "Viewer/ecflowUI/src/TextPager/**"
SPDX-FileCopyrightText = "2010 Anders Bakken"
SPDX-License-Identifier = "Apache-2.0"

# A single third-party header vendored into libs/, rather than under 3rdparty/.
[[annotations]]
path = "libs/core/src/ecflow/core/cereal_optional_nvp.hpp"
SPDX-FileCopyrightText = "2017 Yehonatan Ballas"
SPDX-License-Identifier = "MIT"

# Generated by ajaxload.info and placed in the public domain, as recorded in
# NOTICE. Not ECMWF-authored, so it is excluded from the blanket entry above.
[[annotations]]
path = "Viewer/ecflowUI/images/spinning_wheel.gif"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
