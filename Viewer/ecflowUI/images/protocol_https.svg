<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Marks a server configured for HTTPS.

  The same wireframe globe as the HTTP tag, in green, carrying the closed padlock used by the SSL
  tag so that "with a lock" means the same thing on both families of badge.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" version="1.1">
  <defs>
    <linearGradient id="httpsBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#7ec98d"/>
      <stop offset="1" stop-color="#2e8b41"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="23" fill="url(#httpsBadge)" stroke="#1f6b30" stroke-width="4"/>
  <g fill="none" stroke="#1f6b30" stroke-width="3.5">
    <ellipse cx="32" cy="32" rx="11" ry="23"/>
    <path d="M 9 32 H 55"/>
  </g>
  <!--
    The lock is the one from the SSL tag, scaled about its own centre so that the wireframe stays
    visible around it. A full-size lock would cover the globe almost entirely, leaving the HTTPS
    tag indistinguishable in shape from the SSL one.
  -->
  <g transform="translate(32,36) scale(1.0) translate(-32,-36)">
    <g stroke="#3f3f3f" stroke-linecap="round">
      <path d="M 25 32 V 26 a 7 7 0 0 1 14 0 V 33" fill="none" stroke-width="4"/>
      <rect x="20" y="30" width="24" height="15" rx="2.5" fill="#ffffff" stroke-width="2"/>
    </g>
    <circle cx="32" cy="35.6" r="2.4" fill="#3f3f3f"/>
    <rect x="31" y="37.6" width="2" height="4.6" rx="1" fill="#3f3f3f"/>
  </g>
</svg>
