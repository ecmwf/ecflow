          id="clock-marks" />
    <!-- hands: minute at 12, hour at ~3 -->
    <path style="fill:none;stroke:#3a3a3a;stroke-width:1.6;stroke-linecap:round"
          d="M 23,23 23,18.6 M 23,23 26.4,24.4"
          id="clock-hands" />
    <circle cx="23" cy="23" r="0.9" style="fill:#3a3a3a;stroke:none" id="clock-pin" />
