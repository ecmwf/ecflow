  <!-- background: wide down arrow, shaft in segments fading light->dark grey -->
  <g id="layer-arrow">
    <rect x="7" y="0.5"  width="14" height="5" style="fill:#d8d8d8;stroke:none" id="seg1" />
    <rect x="7" y="7"    width="14" height="5" style="fill:#a8a8a8;stroke:none" id="seg2" />
    <rect x="7" y="13.5" width="14" height="5" style="fill:#7a7a7a;stroke:none" id="seg3" />
    <path
       style="fill:#3a3a3a;fill-rule:evenodd;stroke:none"
       d="M 2.5,20 25.5,20 14,31.5 Z"
       id="arrowhead" />
  </g>

  <!-- foreground: tiny clock face over the bottom-right half -->
  <g id="layer-clock">
    <circle cx="23" cy="23" r="8.5" style="fill:#ffffff;stroke:none" id="clock-casing" />
    <circle cx="23" cy="23" r="7.25" style="fill:#ffffff;stroke:#008000;stroke-width:2;stroke-opacity:1" id="clock-rim" />
    <!-- hour marks at 12, 3, 6, 9 -->
    <path style="fill:none;stroke:#3a3a3a;stroke-width:1;stroke-linecap:butt"
