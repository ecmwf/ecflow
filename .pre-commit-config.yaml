# Vendored; not ours to lint or format.
exclude: '^3rdparty/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^\.cd/conda/meta\.yaml$'  # conda recipe: Jinja, not YAML

  # Keep `exclude` in sync with clang_format_ignore in old_CI.yml until that retires.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: '^(docs|tools|releng)/|^libs/(client|node|pyext)/test/data/|^libs/test/overall/data/'

  - repo: https://github.com/ecmwf/ci-infrastructure
    rev: 2b2f347b71942501be4b964217ec7aeeb79eb27c
    hooks:
      - id: check-ci-approval

