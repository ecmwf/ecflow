# Vendored; not ours to lint or format.
exclude: '^3rdparty/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Reject files that still carry merge-conflict markers (<<<<<<<, =======, >>>>>>>).
      - id: check-merge-conflict
      # Parse every YAML file to catch syntax errors before CI does.
      - id: check-yaml
        exclude: '^\.cd/conda/meta\.yaml$'  # conda recipe: Jinja, not YAML

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      # Format C and C++ sources according to the project .clang-format.
      - id: clang-format
        types_or: [c, c++]
        exclude: '^(docs|tools|releng)/|^libs/(client|node|pyext)/test/data/|^libs/test/overall/data/'

  - repo: https://github.com/ecmwf/ci-infrastructure
    rev: dac4b18ffe60c317fbab05246e851b6971f7eabf
    hooks:
      # Refuse commits to the ECMWF CI configuration that lack the required approval.
      - id: check-ci-approval

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      # Verify that every file carries SPDX copyright and license information (REUSE).
      - id: reuse
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Strip whitespace at the end of lines.
      - id: trailing-whitespace
      # Make every file end with exactly one newline.
      - id: end-of-file-fixer
      # Normalise line endings to LF; no CRLF or mixed endings.
      - id: mixed-line-ending
        args: [--fix=lf]

  # The following are turned off until the tree is cleaned up.
  #
