# NVIDIA 25.11 is not used: the only Boost built for it, 1.90.0, fails to
# compile with nvc++ (Asio's work_result is not SFINAE-friendly; fixed in 1.92.0).

[matrix.build-hpc]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

# Publishing the crates, only from publish-crates.yml: no patches and the default features, as a
# crates.io user gets them, so ecflow-sys builds its C++ from the release tag.
[packages.ecflow-crates]
compiler-inputs = ["cxx-compiler", "rust-compiler"]

[matrix.rust-publish]
packages = ["ecflow-crates"]
publishes = false

[[matrix.rust-publish.include]]
job-script = "./.ci/rust-publish.sh.j2"
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
rust-compiler = "rust-1.90"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6-rust1.90"
platform = "ubuntu-24.04"
