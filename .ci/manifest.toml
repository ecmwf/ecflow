[package]
name = "ecflow"
repo = "ecmwf/ecflow"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

# Each leg names the upstream build of its deps through `upstream-platform` and
# `upstream-cxx-compiler`: an HPC leg's `platform` is its toolchain configuration
# (atos-<configuration>), and some runner platforms have no upstream build.
[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []
platform-input = "upstream-platform"

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "pybind11"
ref = "master"
compiler-inputs = ["upstream-cxx-compiler"]
platform-input = "upstream-platform"

[matrix.build.defaults]
job-script = "./.ci/runner/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
ctest-args = "-L nightly -j 8"

[[matrix.build.include]]
