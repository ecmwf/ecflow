[package]
name = "ecflow"
repo = "ecmwf/ecflow"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []
unless = { execution = "hpc-atos" }

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "pybind11"
ref = "master"
compiler-inputs = ["cxx-compiler"]
unless = { execution = "hpc-atos" }

# On HPC each leg's `platform` names its toolchain configuration (atos-<configuration>),
# which upstreams do not publish; `upstream-platform` and `upstream-cxx-compiler` select
# the upstream build to use instead.
[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []
platform-input = "upstream-platform"
when = { execution = "hpc-atos" }

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "pybind11"
ref = "master"
compiler-inputs = ["upstream-cxx-compiler"]
platform-input = "upstream-platform"
when = { execution = "hpc-atos" }

[matrix.build.defaults]
job-script = "./.ci/runner/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
ctest-args = "-L nightly -j 8"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-8"
c-compiler = "gcc-8"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gcc8-gfortran8-boost-qt5:latest"
platform = "rocky-8"

[[matrix.build.include]]
cxx-compiler = "g++-10"
c-compiler = "gcc-10"
container = "eccr.ecmwf.int/public-ci-images/debian11-gcc10-gfortran10-boost-qt5:latest"
platform = "debian-11"

# Off: the self-hosted macOS builders may trust the compromised eMudhra CAs (Oct 2026).
