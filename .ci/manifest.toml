[package]
name = "ecflow"
prefix = "ecflow"
repo = "ecmwf/ecflow"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "stack-deps"
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[matrix.build.include]]
cxx-compiler = "g++-13"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gfortran13-boost-qt6:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-8"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gfortran8-boost-qt5:latest"
platform = "rocky-8"

[[matrix.build.include]]
cxx-compiler = "g++-10"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/debian11-gfortran10-boost-qt5:latest"
platform = "debian-11"

[[matrix.build.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-arm64"]
platform = "macos-13-arm"

[[matrix.build.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-x86_64"]
platform = "macos-13-x86"

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]
action = "./.github/actions/build-ecflow"
forwarded-inputs = ["cxx-compiler", "build-type"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build", "stack-deps/build"]
ctest = true
# s_test and s_zombies are the long-running system suites the legacy runner
# config (.github/ci-config.yml) also skips.
#
# py3_s_TestClientApi is NOT a legacy-parity exclusion -- it is a product bug,
# confirmed with the maintainers as unrelated to this CI rollout. Its
# test_client_run and test_client_run_with_multiple_paths never see the suite
# reach State.complete, so each burns its 21x3s poll (py_s_TestClientApi.py:582)
# before failing, across all four protocol/sync fixture combinations. That is
# enough to push the whole target past ctest's default 1500s timeout. Excluding
# it drops the other ~219 collected items in that file too -- see the exclusion
# list in the rollout notes. Remove this once the maintainers land a fix.
ctest-args = "-L nightly -E 's_test|s_zombies|py3_s_TestClientApi' -j 8"

# The toolchain is declared here, not buried in a per-toolchain script:
# .ci/hpc/build.sh.j2 is rendered against these values. Note `ctest-args` is
# stated per leg: the HPC lane's exclusion set (-E s_test|s_zombies|s_http)
# genuinely differs from [matrix.build]'s, and having both written down is how
# that stays a decision rather than a drift. Bump `platform` when you bump a
# toolchain: that is what invalidates the cache.
[[matrix.build-hpc.include]]
cxx-compiler = "g++-8"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: it is the alias for the compiler a login node
# gives you with nothing loaded (8.5.0 today), which is what this cluster's GNU
# builds actually target. `module avail gcc` lists no 8.5.0 to pin directly.
# This boost/python/qt set is the one releng/buildit/build.hpc.sh's load_gcc8()
# pairs with gcc 8.5 -- same versions load_gcc13_2() uses, bar the interpreter.
# boost-root is a shell EXPRESSION here: the boost module ships one build per
# compiler under .../GNU/<major>.<minor>, and it must track the gcc actually
# loaded rather than being pinned.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load boost/1.84.0", "load ninja", "load python3/3.11.8-01", "load qt/6.6.1", "load cmake/new"]
cc = "gcc"
cxx = "g++"
boost-root = "/usr/local/apps/boost/1.84.0/GNU/$(gcc -dumpfullversion | cut -d. -f1,2)"
python-root = "/usr/local/apps/python3/3.11.8-01"
tests = true
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "icpx"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
modules = ["load prgenv/intel-llvm", "unload intel", "load intel/2025.3.1", "load boost/1.90.0", "load ninja", "load python3/3.13.13-01", "load qt/6.6.1", "load cmake/new"]
cc = "icx"
cxx = "icpx"
boost-root = "/usr/local/apps/boost/1.90.0/INTEL/2025.3"
python-root = "/usr/local/apps/python3/3.13.13-01"
tests = true
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
modules = ["load prgenv/amd", "unload aocc", "load aocc/4.0.0", "load boost/1.81.0", "load ninja", "load python3/3.10.10-01", "load qt/6.2.0", "load cmake/new"]
cc = "clang"
cxx = "clang++"
boost-root = "/usr/local/apps/boost/1.81.0/AMD/4.0"
python-root = "/usr/local/apps/python3/3.10.10-01"
tests = false
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "nvc++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
modules = ["load prgenv/nvidia", "unload nvidia", "load nvidia/24.11", "load boost/1.87.0", "load ninja", "load python3/3.12.9-01", "load qt/6.6.1", "load cmake/new"]
cc = "nvc"
cxx = "nvc++"
boost-root = "/usr/local/apps/boost/1.87.0/NVIDIA/24.11"
python-root = "/usr/local/apps/python3/3.12.9-01"
tests = false
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build.sh.j2"
triggers = ["upstream-change", "rebuild-request"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build-hpc", "stack-deps/build-hpc"]
