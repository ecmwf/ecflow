[package]
name = "ecflow"
prefix = "ecflow"
repo = "ecmwf/ecflow"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "stack-deps"
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[matrix.build.include]]
cxx-compiler = "g++-13"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gfortran13-boost-qt6:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-8"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gfortran8-boost-qt5:latest"
platform = "rocky-8"

[[matrix.build.include]]
cxx-compiler = "g++-10"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/debian11-gfortran10-boost-qt5:latest"
platform = "debian-11"

[[matrix.build.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-arm64"]
platform = "macos-13-arm"

[[matrix.build.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = ["self-hosted", "platform-builder-macosx-13.4.1-x86_64"]
platform = "macos-13-x86"

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]
action = "./.github/actions/build-ecflow"
forwarded-inputs = ["cxx-compiler", "build-type"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build", "stack-deps/build"]
ctest = true
# s_test and s_zombies are the long-running system suites the legacy runner
# config (.github/ci-config.yml) also skips.
#
# py3_s_TestClientApi is NOT a legacy-parity exclusion --
# it is a timeout problem to be fixed and not part of the CI rollout.
# I discussed it with Marcos
ctest-args = "-L nightly -E 's_test|s_zombies|py3_s_TestClientApi' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "g++-8"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load boost/1.84.0", "load ninja", "load python3/3.11.8-01", "load qt/6.6.1", "load cmake/new"]
cc = "gcc"
cxx = "g++"
boost-root = "/usr/local/apps/boost/1.84.0/GNU/$(gcc -dumpfullversion | cut -d. -f1,2)"
python-root = "/usr/local/apps/python3/3.11.8-01"
tests = true
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "icpx"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
modules = ["load prgenv/intel-llvm", "unload intel", "load intel/2025.3.1", "load boost/1.90.0", "load ninja", "load python3/3.13.13-01", "load qt/6.6.1", "load cmake/new"]
cc = "icx"
cxx = "icpx"
boost-root = "/usr/local/apps/boost/1.90.0/INTEL/2025.3"
python-root = "/usr/local/apps/python3/3.13.13-01"
tests = true
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
modules = ["load prgenv/amd", "unload aocc", "load aocc/4.0.0", "load boost/1.81.0", "load ninja", "load python3/3.10.10-01", "load qt/6.2.0", "load cmake/new"]
cc = "clang"
cxx = "clang++"
boost-root = "/usr/local/apps/boost/1.81.0/AMD/4.0"
python-root = "/usr/local/apps/python3/3.10.10-01"
tests = false
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[[matrix.build-hpc.include]]
cxx-compiler = "nvc++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
modules = ["load prgenv/nvidia", "unload nvidia", "load nvidia/24.11", "load boost/1.87.0", "load ninja", "load python3/3.12.9-01", "load qt/6.6.1", "load cmake/new"]
cc = "nvc"
cxx = "nvc++"
boost-root = "/usr/local/apps/boost/1.87.0/NVIDIA/24.11"
python-root = "/usr/local/apps/python3/3.12.9-01"
tests = false
ctest-args = "-L nightly -E 's_test|s_zombies|s_http' -j 8"

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build.sh.j2"
triggers = ["upstream-change", "rebuild-request"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build-hpc", "stack-deps/build-hpc"]
