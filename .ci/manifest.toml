# Single source of truth for ecflow's CI under ecmwf/ci-infrastructure.
#
# Alongside this manifest:
#   - .github/workflows/ci.yml               push/PR build that publishes the artifact
#   - .github/workflows/cross-repo-trigger.yml
#                                            GENERATED entry point for upstream fan-out
#                                            and consumer-driven rebuilds
#   - .github/workflows/old_CI.yml           the legacy ecmwf/downstream-ci pipeline,
#                                            still running unchanged during migration
#
# ecflow does NOT depend on eckit — nothing in its CMake references it — so no
# eckit edge exists in either direction.

[package]
name = "ecflow"
prefix = "ecflow"
repo = "ecmwf/ecflow"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = "stack-deps"
ref = "master"
# pybind11: ENABLE_PYTHON is ON by default and cmake/Dependencies.cmake does a
# find_package(pybind11 2.10.3 REQUIRED) under it.
compiler-inputs = ["cxx-compiler"]

# platform stays ubuntu-24.04 — the same binary-compatibility class as the other
# repos — so the ecbuild and stack-deps artifacts built under that slug are
# reused rather than rebuilt. The boost-qt6 image differs only in the tools it
# delivers, and `container` is scheduling, not artifact identity.
#
# Qt6 is in that image because ENABLE_UI is ON by default and
# cmake/Dependencies.cmake ecbuild_critical's without Qt5/6 — the runner lane
# therefore builds ecFlowUI, exactly as the HPC lane does via `module load
# qt/6.6.1`. Do not drop the image for a plain boost one without also passing
# -DENABLE_UI=OFF, or configure fails.
[[matrix.build.include]]
cxx-compiler = "g++-13"
build-type = "Release"
runs-on = "arc-runner-very-large"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gfortran13-boost-qt6:latest"
platform = "ubuntu-24.04"

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]
action = "./.github/actions/build-ecflow"
forwarded-inputs = ["cxx-compiler", "build-type"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build", "stack-deps/build"]
# Run the suite in the fan-out too, not just on push/PR: an upstream-driven
# build that only compiles proves nothing beyond "ecflow still links against the
# new ecbuild".
ctest = true
# Identical to ci.yml's Test step, so the fan-out gates on the same set the
# push/PR build does. Both copy .github/ci-config.yml's ctest_options: `-L
# nightly` is the set that config gates on, and s_test/s_zombies
# (libs/test/overall) are the long-running system suites it skips. Quoted because
# the shell would otherwise read the `|` as a pipe.
# NOT the HPC recipes' `-E s_http`, which is a cluster-specific narrowing from
# .github/ci-hpc-config.yml (no http server on the compute node).
# -j 8 rather than $(nproc): ecflow's suite starts real servers, so parallelism
# is not free, and 8 is the width .github/cd-config.yml already uses.
ctest-args = "-L nightly -E 's_test|s_zombies' -j 8"

# --- HPC build --------------------------------------------------------------
# ecflow built inside a SLURM job, linking the ecbuild and stack-deps (pybind11)
# artifacts for its own platform. Four toolchains, one per legacy
# ci-hpc-config.yml platform we reproduce: gnu-15.2.0, intel-2025.3.1,
# aocc-4.0.0 and nvidia-24.11. Each gets its own recipe and its own platform
# slug, because each builds a different ABI and they must never share an artifact
# name. The first two run tests, the last two do not — see their recipes.
#
# Every recipe PINS its compiler (module + CMAKE_CXX_COMPILER): prgenv's default
# resolves to the system compiler, which mismatches the Boost build each recipe
# links against.
#
# Boost, Python and Qt come from cluster modules rather than artifacts: ecflow
# links Boost.Python against a specific interpreter and the cluster ships the
# matched pair. pybind11 still comes from stack-deps.
#
# `needs` names HPC kinds only — the lanes are separate artifact universes.
[[matrix.build-hpc.include]]
cxx-compiler = "g++-13"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
job-script = "./.ci/hpc/build-gnu.sh"

[[matrix.build-hpc.include]]
cxx-compiler = "icpx"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-intel"
job-script = "./.ci/hpc/build-intel.sh"

# Build-only toolchains, mirroring the legacy ci-hpc-config.yml's `aocc-4.0.0`
# and `nvidia-24.11`, which are build-only there too (`ctest_options: --version`,
# that config's way of saying "no tests"). Our recipes own the test invocation,
# so they express it by simply not containing a ctest line.
#
# nvidia-24.11 rather than the config's nvidia-22.11: releng/buildit/build.hpc.sh
# only knows nvidia/24.1, 24.11 and 25.11, so `module load nvidia/22.11` would
# fail at job start.
[[matrix.build-hpc.include]]
cxx-compiler = "clang++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-aocc"
job-script = "./.ci/hpc/build-aocc.sh"

[[matrix.build-hpc.include]]
cxx-compiler = "nvc++"
build-type = "Release"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-nvidia"
job-script = "./.ci/hpc/build-nvidia.sh"

[matrix.build-hpc]
execution = "hpc"
container-credentials = true
job-script = "./.ci/hpc/build-gnu.sh"
triggers = ["upstream-change", "rebuild-request"]
forwarded-deps-outputs = ["cmake-prefix-path"]
needs = ["ecbuild/build-hpc", "stack-deps/build-hpc"]
