{{- /*
The administrator's files of the server, rendered from values: server_environment.cfg
from `server.environment`, and the entries of `server.admin.files`. Each key is the
path of the file relative to /admin, with "__" in place of "/", the layout the init
container of the server Pod expands.
*/ -}}
{{- if not .Values.server.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecflow-chart.adminSecretName" . }}
  labels:
    {{- include "ecflow-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  server_environment.cfg: |
    # Rendered by {{ .Chart.Name }} {{ .Chart.Version }} from the values of the
    # release {{ .Release.Name }}; edit the values, not this file.
    {{- range $name, $value := .Values.server.environment }}
    {{ $name }} = {{ $value }}
    {{- end }}
  {{- range $path, $content := .Values.server.admin.files }}
  {{ $path | replace "/" "__" }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
