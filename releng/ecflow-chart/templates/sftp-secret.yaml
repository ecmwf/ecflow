{{- /*
The authorized keys of the SFTP accounts, rendered from `users` when no existing
Secret is named: one `<user>.authorized_keys` entry per user with keys, in the
layout the entrypoint of the sidecar reads.
*/ -}}
{{- if and .Values.sftp.enabled (not .Values.sftp.existingSecret) (include "ecflow-chart.sftpUsers" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecflow-chart.sftpSecretName" . }}
  labels:
    {{- include "ecflow-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: sftp
type: Opaque
stringData:
  {{- range .Values.users }}
  {{- if .sshAuthorizedKeys }}
  {{ .name }}.authorized_keys: |
    {{- range .sshAuthorizedKeys }}
    {{ . }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
