{{- /*
A self-signed certificate for the reverse proxy, generated by the chart when asked.
Helm renders the template at every upgrade, so the certificate changes each time;
a deployment that needs a stable certificate names an existing Secret instead.
*/ -}}
{{- if and .Values.revproxy.enabled .Values.revproxy.tls.selfSigned.enabled (not .Values.revproxy.tls.existingSecret) }}
{{- $cert := genSelfSignedCert .Values.revproxy.serverName nil (list .Values.revproxy.serverName) (int .Values.revproxy.tls.selfSigned.days) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecflow-chart.revproxyTlsSecretName" . }}
  labels:
    {{- include "ecflow-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: revproxy
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
