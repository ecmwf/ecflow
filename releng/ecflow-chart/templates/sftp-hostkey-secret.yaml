{{- /*
The host key of the SFTP sidecar, generated by the chart at the first install and
kept from then on: `lookup` reads the existing Secret at every upgrade, so the key
only changes if the Secret is deleted, and the resource policy keeps it through an
uninstall. `helm template` has no cluster to look up and renders a fresh key.
OpenSSH reads the PKCS#8 PEM form that Helm generates.
*/ -}}
{{- if and .Values.sftp.hostKey.generate (not .Values.sftp.hostKey.existingSecret) }}
{{- $name := include "ecflow-chart.sftpHostKeySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ecflow-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: sftp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "ssh_host_ed25519_key") }}
  ssh_host_ed25519_key: {{ index $existing.data "ssh_host_ed25519_key" }}
  {{- else }}
  ssh_host_ed25519_key: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
{{- end }}
