{{- /*
The volumes of the server (the workspace, the state and, unless disabled, the
homes). A PersistentVolumeClaim is kept across upgrades (Helm never deletes a PVC
it created unless the release is uninstalled), so the suites, the checkpoint and the
homes survive a new version of the chart.
*/ -}}
{{- range $name, $volume := .Values.server.persistence }}
{{- /* `default` would turn an explicit false into true, so the key is tested */ -}}
{{- if not (and (hasKey $volume "enabled") (not $volume.enabled)) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ecflow-chart.fullname" $ }}-{{ $name }}
  labels:
    {{- include "ecflow-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  accessModes:
    {{- toYaml $volume.accessModes | nindent 4 }}
  {{- with $volume.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $volume.size }}
{{- end }}
{{- end }}
