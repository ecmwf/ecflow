# Default values of ecflow-chart. A deployment is a set of values layered over these
# (helm upgrade --install <release> <chart> -f <profile>.yaml); the profiles of the
# known targets are under examples/.

# The name the objects of the release derive from: `<release>-<nameOverride>`, or the
# release name alone when it already contains this name (a release named `ecflow`
# gives `ecflow-server`, `ecflow-sftp`, ...). `fullnameOverride` fixes the whole name.
nameOverride: ecflow
fullnameOverride: ""

# Settings shared with the subcharts.
global:
  # Registry prefix of every image (the subcharts read global.imageRegistry when they
  # support it). Empty keeps the registry of each image.repository.
  imageRegistry: ""
  # Names of existing Secrets of type kubernetes.io/dockerconfigjson used to pull the
  # images.
  imagePullSecrets: []
  ingress:
    # The ingress controller of the cluster, which decides the annotations of the
    # Ingress: `nginx-inc` (NGINX Inc controller, the ECMWF clusters) or
    # `nginx-community` (ingress-nginx, the DestinE clusters and kind).
    controller: nginx-community

# auth-o-tron, deployed by auth-o-tron-chart (oci://eccr.ecmwf.int/auth-o-tron) as a
# dependency. The keys below are passed to that chart as they are; its own defaults
# apply to anything not set here (helm show values oci://eccr.ecmwf.int/auth-o-tron/auth-o-tron-chart).
auth-o-tron:
  enabled: true
  # The reverse proxy addresses the authentication service as `authotron`, whatever
  # the release name.
  fullnameOverride: authotron
  image:
    repository: eccr.ecmwf.int/auth-o-tron/auth-o-tron
    tag: 0.3.7
  # The metrics endpoint stays, but the ServiceMonitor needs the Prometheus Operator
  # CRDs, absent from a kind cluster.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  # Secrets that the configuration does not need to hold are passed as environment
  # variables, from an existing Secret, for example:
  #   - name: AOT_JWT__SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: authotron-jwt
  #         key: secret
  extraEnv: []
  # The configuration of auth-o-tron, rendered as it is into config.yaml. auth-o-tron
  # authenticates only: every user comes through the authentication authority, the
  # ECMWF API, and holds no list of users here. What an authenticated user may do is
  # decided by the ecFlow server (ECF_PERMISSIONS), and who gets an account is the
  # `users` list below. A test profile may add a `plain` provider with throwaway users
  # (see examples/values-kind.yaml); Helm replaces lists, so such a profile restates
  # the whole `providers` list.
  config:
    version: 1.0.0
    logging:
      level: debug
      format: console
    auth:
      timeout_in_ms: 3000
    providers:
      - name: ecmwf-api-provider
        type: ecmwf-api
        uri: https://api.ecmwf.int/v1
        realm: ecmwf
    store:
      enabled: false
    services: []
    jwt:
      exp: 3600
      iss: authotron-issuer
      secret: authotron-secret-key
      aud: authotron-audience
    include_legacy_headers: true
    bind_address: 0.0.0.0:8080

# The images of the stack. Each image is <registry>/<repository>:<tag>, where the
# registry is global.imageRegistry when set, else the one in the repository. A digest
# (sha256:...) takes precedence over the tag when given.
images:
  server:
    repository: eccr.ecmwf.int/ecflow-dev-environments/ecflow-server-dev
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  sftp:
    repository: eccr.ecmwf.int/ecflow-dev-environments/ecflow-sftp-dev
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  revproxy:
    repository: eccr.ecmwf.int/ecflow-dev-environments/ecflow-revproxy-dev
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent

# The DNS domain of the cluster, part of the Service names the reverse proxy resolves
# (<service>.<namespace>.svc.<clusterDomain>).
clusterDomain: cluster.local

# The accounts of the deployment, declared once by the deployer: not who may log in
# (that is the authentication authority's), but who has an account on the server
# side. Each entry names a user; `sshAuthorizedKeys` lists the public keys with which
# the user reaches the SFTP sidecar, and marks the user as an SFTP account; `uid` is
# the numeric id under which the user owns files on the workspace, the same in the SFTP
# sidecar and, later, in the server container when the jobs run as their owner. Give
# every account a uid of its own, 2000 or above: 1000 is the server's own account, and
# an account without a uid gets the next free one, which on a fresh container is 1000.
#   - name: alice
#     uid: 2001
#     sshAuthorizedKeys:
#       - ssh-ed25519 AAAA... alice@host
#   - name: bob
#     uid: 2002
#     sshAuthorizedKeys:
#       - ssh-ed25519 AAAA... bob@host
users: []

# The ecFlow server.
server:
  port: 8888
  # The administrator's files, expanded into /admin by the init container. The chart
  # renders them into a Secret of the release: server_environment.cfg from
  # `environment` below, and every entry of `files` (a path relative to /admin, and
  # its content; `troikaw` and `*.sh` are made executable). An existing Secret, whose
  # keys are the paths with "__" in place of "/", replaces the rendered one when named.
  admin:
    existingSecret: ""
    files: {}
    #  troikaw: |
    #    #!/bin/sh
    #    exec troika "$@"
  # The settings of server_environment.cfg, which the server reads from /admin at
  # start: one `NAME = VALUE` line each, without quotes around the value. Settings the
  # launch script of the image exports (ECF_PORT, ECF_HOME) are not set here. Names
  # prefixed with <host>.<port>. by the server: ECF_CHECK, ECF_CHECKOLD, ECF_LOG,
  # ECF_LISTS, ECF_PASSWD, ECF_CUSTOM_PASSWD.
  environment:
    ECF_CHECK: ecf.check
    ECF_CHECKOLD: ecf.check.b
    ECF_CHECKINTERVAL: 120
    ECF_CHECKMODE: CHECK_ON_TIME
    ECF_LOG: ecf.log
    ECF_INTERVAL: 60
    ECF_JOB_CMD: "%ECF_JOB% 1> %ECF_JOBOUT% 2>&1"
    ECF_KILL_CMD: "kill -15 %ECF_RID%"
    ECF_STATUS_CMD: "ps --pid %ECF_RID% -f > %ECF_JOB%.stat 2>&1"
    ECF_CHECK_CMD: "ps --pid %ECF_RID% -f"
    ECF_URL_CMD: "${BROWSER:=firefox} -new-tab %ECF_URL_BASE%/%ECF_URL%"
    ECF_URL_BASE: https://confluence.ecmwf.int
    ECF_URL: display/ECFLOW/ecflow+home
    ECF_MICRODEF: "%"
    ECF_LISTS: ecf.lists
    ECF_PASSWD: ecf.passwd
    ECF_CUSTOM_PASSWD: ecf.custom_passwd
    ECF_TASK_THRESHOLD: 4000
  # Delay and period of the readiness probe, which pings the server with ecflow_client.
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 8
  # The two volumes of the server: the workspace (suites, task scripts, job output)
  # and the state (checkpoint files). Both are mounted by one node at a time.
  persistence:
    workspace:
      size: 1Gi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
    state:
      size: 64Mi
      storageClassName: ""
      accessModes: [ReadWriteOnce]
  # The Service in front of the server; NodePort exposes it on a kind cluster.
  service:
    type: ClusterIP
    nodePort: ""

# The SFTP sidecar of the server Pod, which gives the users key-based access to the
# workspace.
sftp:
  enabled: true
  port: 22
  # An existing Secret with the keys of the sidecar: `<user>.authorized_keys` per
  # user, and optionally `ssh_host_ed25519_key`. When empty, the chart renders the
  # authorized keys of `users` into a Secret of its own, and the sidecar generates a
  # temporary host key at each start.
  existingSecret: ""
  service:
    type: ClusterIP
    nodePort: ""
  # Publication of the SFTP port outside the cluster through the NGINX Inc controller
  # (global.ingress.controller: nginx-inc only): a TransportServer of the namespace,
  # passing the TCP listener named below to the SFTP Service. The listener is declared
  # in the GlobalConfiguration of the controller by the platform team, which also
  # decides the port it opens; ask them for its name. Reachable on the ECMWF LAN.
  transportServer:
    enabled: false
    listener: ecflow-sftp
    annotations: {}

# The reverse proxy (nginx) in front of the server: every request to /v1/ecflow is
# authenticated with auth-o-tron (auth_request) before it is forwarded. HTTPS only.
revproxy:
  enabled: true
  replicas: 1
  # The server_name of the nginx configuration, and the subject of a self-signed
  # certificate when the chart generates one.
  serverName: localhost
  # The cluster DNS service, through which nginx resolves the upstreams per request:
  #   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
  resolver: 10.96.0.10
  proxyReadTimeout: 500s
  proxyConnectTimeout: 90s
  # The certificate and key, in a Secret of type kubernetes.io/tls (tls.crt, tls.key):
  # an existing Secret, or one the chart generates with a self-signed certificate for
  # `serverName` (regenerated at every upgrade). When neither is given, the image
  # generates a self-signed certificate for localhost at each start.
  tls:
    existingSecret: ""
    selfSigned:
      enabled: false
      days: 365
  service:
    type: ClusterIP
    nodePort: ""

# NetworkPolicies, enforced by the network plugin of the cluster when it supports
# them: the server is reachable on its port from the reverse proxy only (it trusts
# the identity an unauthenticated request claims), auth-o-tron from the reverse proxy
# only (credentials could otherwise be tried from any Pod), and the SFTP sidecar from
# anywhere (sshd authenticates every connection itself).
networkPolicy:
  enabled: true
  # When the Ingress is enabled, the reverse proxy admits only the Pods of the ingress
  # controller, selected per controller by the labels of its namespace and Pods. The
  # community defaults are those of the ingress-nginx manifests; the NGINX Inc ones
  # are those of its Helm chart and are confirmed on the ECMWF clusters at the first
  # deployment. Without the Ingress (kind, port forwards), the reverse proxy stays
  # open: NodePort traffic carries no Pod identity.
  ingressController:
    nginx-community:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
    nginx-inc:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nginx-ingress
      podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-ingress

# The Ingress that publishes the reverse proxy outside the cluster. The host is
# <hostPrefix>.<domain>, or `host` when set. TLS terminates at the controller, which
# then reaches the reverse proxy over HTTPS; the certificate comes from the named
# Secret, issued by cert-manager when `certManager.clusterIssuer` is set.
ingress:
  enabled: false
  className: nginx
  hostPrefix: ecflow
  domain: example.org
  host: ""
  tls:
    enabled: true
    # Defaults to <fullname>-ingress-tls.
    secretName: ""
  certManager:
    # `letsencrypt-production` on the ECMWF clusters, for public and LAN-only names.
    clusterIssuer: ""
  # Settings of the NGINX Inc controller at ECMWF (ignored by nginx-community): the
  # DNS view of the name (`lan` for an ECMWF-only name; public when empty) and the
  # transport server of the DNS operator.
  dns:
    view: ""
    transportServer: vs-transport-https
  # A proxy read timeout of the controller, for long requests; empty keeps the
  # controller's default.
  proxyReadTimeout: ""
  # Further annotations, added as they are.
  annotations: {}

# The checks of `helm test`: a Pod of the release, run on demand, that reaches the
# server through the reverse proxy with ecflow_client, as a client does. It verifies
# that valid credentials are accepted, that missing and wrong ones are refused, and
# that the refused requests left no trace in the server log. The credentials are those
# of a user that auth-o-tron accepts with HTTP Basic authentication, which only a
# `plain` provider of a test profile offers; the defaults therefore disable the test,
# and a test profile enables it with its throwaway user (examples/values-kind.yaml).
tests:
  enabled: false
  user: ""
  password: ""
  # A name that no user has; its refused requests must not appear in the log.
  intruder: intruder
