# The accounts of a deployment: copy this file to users.yaml (ignored by git, since it
# holds the public keys of real people), fill it in, and pass it to every helm upgrade
# of the release after the profile of the target:
#
#   helm upgrade --install ecflow . -n <namespace> -f examples/values-<target>.yaml -f users.yaml
#
# An account is not a login: who may log in is decided by the authentication
# authority (the ECMWF API), and what a user may do by the server. An account gives a
# user a uid under which they own files on the workspace, an SFTP login with their
# public keys, and a private home, /home/<user>, that no other user and not the server
# can read. Use a uid of 2000 or above (1000 is the server's own account), never two
# the same; keep an account's uid for its lifetime, since the files it owns carry it.
users:
  - name: alice
    uid: 2001
    sshAuthorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOfAliceReplaceMe alice@laptop
  - name: bob
    uid: 2002
    sshAuthorizedKeys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQExampleKeyOfBobReplaceMe bob@desktop
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleSecondKeyOfBob bob@laptop
  # An account without keys gets a uid and a home, but no SFTP login.
  - name: charlie
    uid: 2003
