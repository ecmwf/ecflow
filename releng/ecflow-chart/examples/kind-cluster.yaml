# A kind cluster for a local deployment of the chart with examples/values-kind.yaml:
#
#   kind create cluster --config examples/kind-cluster.yaml
#
# The node carries the label that the kind manifest of ingress-nginx schedules the
# controller on, and maps the controller's ports 80 and 443 to the host, where the
# Ingress host of the profile (ecflow.localtest.me) resolves to 127.0.0.1. SFTP is
# published as a NodePort on 30022, mapped to 2222 on the host. Nothing else of the
# deployment is reachable from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecflow
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30022
        hostPort: 2222
        listenAddress: "127.0.0.1"
        protocol: TCP
