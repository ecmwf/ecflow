# A local deployment on kind, published through the community ingress-nginx
# controller (installed in the cluster as the README describes) on the host below,
# which resolves to 127.0.0.1; SFTP on the node port that the kind cluster maps to the
# host. The images are loaded into the cluster with `kind load docker-image`.
#
#   helm upgrade --install ecflow . -n ecflow --create-namespace -f examples/values-kind.yaml

global:
  ingress:
    controller: nginx-community

ingress:
  enabled: true
  host: ecflow.localtest.me
  tls:
    enabled: true
    # No cert-manager on kind: with the Secret absent, the controller serves its own
    # self-signed certificate.
    secretName: ecflow-ingress-tls

sftp:
  service:
    type: NodePort
    nodePort: 30022

# The test users of auth-o-tron (values.yaml) apply; the SFTP accounts are listed
# here, with the public keys of the developers that use the deployment.
users: []
#  - name: mamb
#    sshAuthorizedKeys:
#      - ssh-ed25519 AAAA... mamb@host
