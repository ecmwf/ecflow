# The test deployment on the ECMWF cluster webapps-test, namespace
# ecflow-multitenant-test, published through the NGINX Inc controller as agreed with
# the platform support (SD-130891): a LAN-only name, a certificate from
# cert-manager, and the SFTP port through a TransportServer once its listener is
# known. The images are pulled from eccr.ecmwf.int.
#
#   helm upgrade --install ecflow . -n ecflow-multitenant-test -f examples/values-webapps-test.yaml

global:
  ingress:
    controller: nginx-inc

ingress:
  enabled: true
  host: ecflow-mt-test.ecmwf.int
  certManager:
    clusterIssuer: letsencrypt-production
  dns:
    view: lan

sftp:
  transportServer:
    # Enable once the platform team names the listener.
    enabled: false
    listener: ecflow-sftp

# auth-o-tron authenticates through the ECMWF API only (the chart defaults): no user
# list. The checks of `helm test` need a user with HTTP Basic credentials, which only a
# `plain` test provider offers, so they are off here. For a test period, uncomment the
# two blocks below, the same throwaway users as examples/values-kind.yaml (Helm replaces
# lists, so the whole `providers` list is restated).
tests:
  enabled: false
