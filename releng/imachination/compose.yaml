services:

  revproxy:
    hostname: revproxy
    image: ${REVPROXY_IMAGE:-eccr.ecmwf.int/ecflow-dev-environments/ecflow-revproxy-dev:latest}
    # nginx resolves the upstream host names once, at start-up, and refuses to
    # start if any of them is unknown. Both upstreams must therefore exist before
    # the reverse proxy is started.
    depends_on:
      - ecflow
      - authotron
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./revproxy/server:/usr/share/nginx/html/server
      - ./revproxy/cfgs/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      inner:
        ipv4_address: 172.30.0.2

  authotron:
    hostname: authotron
    image: eccr.ecmwf.int/auth-o-tron/auth-o-tron:0.3.7
    ports:
      - "8080:8080"
    volumes:
      - ./authotron/config.yaml:/app/config.yaml
    networks:
      inner:
        ipv4_address: 172.30.0.3

  ecflow:
    hostname: ecflow-server
    image: ${ECFLOW_IMAGE:-eccr.ecmwf.int/ecflow-dev-environments/ecflow-server-dev:latest}
    pull_policy: always
    ports:
      - "8888:8888"
    volumes:
      - ${WORKSPACE_DIR:-./ecflow/workspace}:${WORKSPACE_DIR:-/workspace}
      # The administrator's files, apart from the workspace; the server starts
      # there, and reads server_environment.cfg from it
      - ./ecflow/admin:/admin:ro
      # The checkpoint of the server, apart from the workspace as well
      - ecflow-state:/state
    working_dir: /admin
    environment:
      - ECFLOW_WORKSPACE_DIR=${WORKSPACE_DIR:-/workspace}
      - ECF_CHECK=/state/ecflow-server.8888.ecf.check
      - ECF_CHECKOLD=/state/ecflow-server.8888.ecf.check.b
    networks:
      inner:
        ipv4_address: 172.30.0.4

volumes:
  ecflow-state:
    name: ecflow-state

networks:
  inner:
    name: inner
    ipam:
      config:
        - subnet: 172.30.0.0/16
