# The Kubernetes variant of revproxy/cfgs/nginx/default.conf. It differs from
# the Compose variant in four respects, each forced by the deployment:
#
#  1. The upstreams are Service names, not addresses on a fixed subnet.
#  2. They are resolved per request, through the cluster DNS declared below,
#     rather than once at start-up. Kubernetes gives no ordering guarantee, and
#     nginx exits if an upstream name is unknown when it starts.
#  3. Access logs go to standard output. The static content is supplied by a
#     ConfigMap, which is mounted read-only, so a log file cannot be opened
#     inside it.
#  4. There is no server on port 80. Port 443 is the whole external surface of
#     the deployment, and plain HTTP is served nowhere.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name localhost;

  ssl_certificate     /etc/ssl/certs/revproxy.crt;
  ssl_certificate_key /etc/ssl/private/revproxy.key;

  # The cluster DNS service. Confirm with:
  #   kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
  resolver 10.96.0.10 valid=10s ipv6=off;

  access_log /dev/stdout;
  error_log  /dev/stderr info;

  location / {
    root /usr/share/nginx/html/server;
    index index.html index.htm;
  }

  location /v1/ecflow {
    proxy_read_timeout 500s;
    proxy_connect_timeout 90s;

    auth_request /auth;

    # Held in a variable so that the name is resolved per request. A consequence
    # is that nginx no longer substitutes the matched location prefix, so the
    # original URI is appended explicitly; without it every request would reach
    # the server as exactly /v1/ecflow, discarding any deeper path and the query
    # string.
    set $ecflow_upstream http://ecflow-server.imachination.svc.cluster.local:8888;
    proxy_pass $ecflow_upstream$request_uri;

    # Forwarding Authorization Headers:
    # * Authorization   [Bearer <token>]
    auth_request_set    $authorization $upstream_http_authorization;
    proxy_set_header    Authorization $authorization;
    # * X-Auth-Username [username] (legacy)
    auth_request_set    $auth_username $upstream_http_x_auth_username;
    proxy_set_header    X-Auth-Username $auth_username;
    # * X-Auth-Realm    [realm] (legacy)
    auth_request_set    $auth_realm $upstream_http_x_auth_realm;
    proxy_set_header    X-Auth-Realm $auth_realm;
    # * X-Auth-Roles    [role[,role]*] (legacy)
    auth_request_set    $auth_roles $upstream_http_x_auth_roles;
    proxy_set_header    X-Auth-Roles $auth_roles;

    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Host $host;

    proxy_redirect      default /;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html/server;
  }

  location = /auth {
    internal;
    set $auth_upstream http://authotron.imachination.svc.cluster.local:8080;
    proxy_pass $auth_upstream/authenticate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }
}
