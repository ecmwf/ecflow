apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecflow-server
  labels:
    app: ecflow-server
spec:
  replicas: 1
  # The workspace and the checkpoint are on volumes that a single node mounts at
  # a time; the Pod is therefore replaced, rather than rolled, so that the old
  # Pod releases the volumes before the new one mounts them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ecflow-server
  template:
    metadata:
      labels:
        app: ecflow-server
    spec:
      # Kubernetes otherwise injects a legacy Docker-link variable for every
      # service in the namespace. The Service named `ecflow-server` yields
      # ECFLOW_SERVER_PORT=tcp://<clusterIP>:8888, which is precisely the
      # variable the image launch script reads to decide the port, so the server
      # would be started with a URL where an integer is expected and would refuse
      # to start. None of those variables is used here.
      enableServiceLinks: false

      # The launch script of the image names the server `ecflow-server`, and the
      # jobs the server generates run in this same container and address it by
      # that name. Resolving the name to the pod removes the dependency on the
      # Service, which has no endpoints until the readiness probe first succeeds.
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - ecflow-server

      # The image stops the server cleanly on SIGTERM, tini forwarding the signal
      # to the launch script, which asks the server to terminate and kills it if
      # that request fails. A short grace period is therefore ample, and keeps a
      # deletion from waiting the full default.
      terminationGracePeriodSeconds: 10

      # The administrator's files (A) reach the Pod as one Secret, ecflow-admin, loaded by
      # `imachination.sh admin`: a Secret has flat keys, so each path is encoded with "__" in place of "/"
      # (troika/mamb/troika.yml as troika__mamb__troika.yml). This container expands them into /admin,
      # which the server then mounts read-only; SFTP users never see it, as the sidecar does not mount it.
      # A change to the Secret takes effect when the Pod is replaced.
      #
      # The same container gives the workspace and the checkpoint volumes, when owned by root, as a new
      # volume is, to the user ecflow of the image (1000:1000, the ECFLOW_UID and ECFLOW_GID build
      # arguments of the image), before either container starts: the launch script of the server aligns
      # ecflow with the owner of the workspace, and the SFTP sidecar gives its accounts the group of the
      # workspace, which it reads once, when it starts. The workspace is made group-writable, so that
      # what the SFTP users upload the server can use, and conversely.
      initContainers:
        - name: admin
          image: eccr.ecmwf.int/ecflow-dev-environments/ecflow-server-dev:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for source in /admin-source/*; do
                  [ -f "${source}" ] || continue
                  key=$(basename "${source}")
                  target="/admin/$(printf '%s' "${key}" | sed 's|__|/|g')"
                  mkdir -p "$(dirname "${target}")"
                  cp "${source}" "${target}"
                  case "${key}" in
                      *troikaw|*.sh) chmod 0755 "${target}" ;;
                      *) chmod 0444 "${target}" ;;
                  esac
                  echo "admin: ${target}"
              done
              for volume in /workspace /state; do
                  if [ "$(stat -c %u "${volume}")" = "0" ]; then
                      chown 1000:1000 "${volume}"
                      chmod 0775 "${volume}"
                      echo "admin: ${volume} given to 1000:1000"
                  fi
              done
          volumeMounts:
            - name: admin-source
              mountPath: /admin-source
              readOnly: true
            - name: admin
              mountPath: /admin
            - name: workspace
              mountPath: /workspace
            - name: state
              mountPath: /state

      containers:
        - name: ecflow-server
          image: eccr.ecmwf.int/ecflow-dev-environments/ecflow-server-dev:latest
          # On kind, every image is loaded into the node by `imachination.sh
          # images`, which pulls it on the host; the node never pulls it, with
          # IfNotPresent overriding the Always that a `latest` tag implies.
          # `imachination.sh apply` replaces these names with those of the
          # images selected by ECFLOW_SOURCE and the other *_SOURCE variables.
          imagePullPolicy: IfNotPresent
          workingDir: /workspace

          # Lower the open files limit (1073741816 on kind), which the server walks
          # to close descriptors in every forked job, stalling job submission.
          command:
            - /usr/bin/tini
            - --
            - /bin/sh
            - -c
            - ulimit -n 1048576 && exec /opt/local/bin/launch.sh

          env:
            - name: ECFLOW_WORKSPACE_DIR
              value: /workspace
            - name: ECFLOW_SERVER_HOST
              value: ecflow-server
            # Stated explicitly, so that the port survives even if the service
            # links above are ever re-enabled.
            - name: ECFLOW_SERVER_PORT
              value: "8888"
            # Separates the suite scripts from the server's own mutable state, so
            # that the two may later be delivered by different means.
            - name: ECF_FILES
              value: /workspace/files
            # The server reads server_environment.cfg from the administrator's files,
            # and keeps its checkpoint on a volume of its own; ECF_HOME, and with it
            # the log, stays in the workspace, which the users see
            - name: ECFLOW_CONFIG_DIR
              value: /admin
            - name: ECF_CHECK
              value: /state/ecflow-server.8888.ecf.check
            - name: ECF_CHECKOLD
              value: /state/ecflow-server.8888.ecf.check.b

          ports:
            - name: ecflow
              containerPort: 8888

          # The native protocol ping, issued by the real client against the
          # server itself. `--http` is required because the server is started
          # with `--http`, so the client must carry the native protocol over an
          # HTTP connection.
          #
          # The probe runs as root, while the server runs as `ecflow`; the ping is
          # issued as that user, with its own HOME, exactly as the health check of
          # the image does, since ecflow_client reports a connection error when
          # HOME is not accessible to it.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - HOME=/home/ecflow ECF_CONNECT_TIMEOUT=5 setpriv --reuid=ecflow
                  --regid=ecflow --init-groups ecflow_client --http --host localhost
                  --port 8888 --ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: admin
              mountPath: /admin
              readOnly: true
            - name: state
              mountPath: /state

        # An SFTP endpoint to the same workspace, so that suite files can be
        # delivered to the server with sftp or scp, as on a conventional host.
        # Each user listed has an account of their own, and logs in with a key
        # from the Secret sftp-keys, which only this container mounts.
        - name: sftp
          image: eccr.ecmwf.int/ecflow-dev-environments/ecflow-sftp-dev:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: SFTP_USERS
              value: "mamb admin"
            - name: SFTP_KEYS_DIR
              value: /etc/ssh/imachination

          ports:
            - name: ssh
              containerPort: 22

          # Checks that sshd is running, rather than connecting to it: sshd
          # penalises a source address that connects without authenticating, and
          # through the node port every client shares the address of the node.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 "$(cat /run/sshd.pid)"
            initialDelaySeconds: 2
            periodSeconds: 10

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: sftp-keys
              mountPath: /etc/ssh/imachination
              readOnly: true

      volumes:
        # The workspace, reached from outside the cluster through the SFTP
        # sidecar
        - name: workspace
          persistentVolumeClaim:
            claimName: ecflow-workspace
        # The administrator's files: the Secret as loaded, and its expansion
        - name: admin-source
          secret:
            secretName: ecflow-admin
        - name: admin
          emptyDir: {}
        # The checkpoint of the server
        - name: state
          persistentVolumeClaim:
            claimName: ecflow-state
        # The keys of the SFTP users and the host key of the sidecar, readable by
        # root only, as the SFTP users could otherwise read the host key; the
        # sidecar installs them when it starts. Optional, so that the Pod starts
        # before any key is loaded, no user being able to log in until then
        - name: sftp-keys
          secret:
            secretName: sftp-keys
            defaultMode: 0400
            optional: true
