name: Build ecflow from source
description: >
  Builds and installs the checked-out ecflow with
  ecmwf/ci-infrastructure/actions/cmake-build, which documents the common inputs.

  ecflow's tests link against the build tree rather than the install tree (and
  use static libraries that never reach the install prefix), so the build tree
  is an output and ctest must run against it in the same job.

inputs:
  cmake-prefix-path:
    description: 'Prefixes of the resolved deps (ecbuild, stack-deps/pybind11)'
    required: true
  c-compiler:
    description: 'C compiler, e.g. gcc-13'
    required: true
  cxx-compiler:
    description: 'C++ compiler, e.g. g++-13'
    required: true
  build-type:
    description: 'CMake build type'
    required: true
  boost-root:
    description: >
      Boost install prefix. Empty detects it: /usr in the Linux images, the
      homebrew prefix on macOS.
    required: false
    default: ''

outputs:
  install-path:
    description: 'Absolute path where ecflow is installed'
    value: ${{ steps.build.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree — ecflow tests run here, not from the install tree'
    value: ${{ steps.build.outputs.build-dir }}

runs:
  using: composite
  steps:
    - name: Locate Boost
      id: boost
      shell: bash
      env:
        BOOST_ROOT_IN: ${{ inputs.boost-root }}
      run: |
        set -euo pipefail

        # Linux finds the multiarch libdir itself; homebrew is not on that path.
        boost_root="$BOOST_ROOT_IN"
        if [ -z "$boost_root" ]; then
          if [ "$(uname)" = Darwin ]; then
            boost_root="$(brew --prefix)"
          else
            boost_root=/usr
          fi
        fi

        {
          echo "cmake-args<<EOF"
          echo "-DBOOST_ROOT=$boost_root"
          if [ "$(uname)" = Darwin ]; then
            echo "-DBOOST_INCLUDEDIR=$boost_root/include"
            echo "-DBOOST_LIBRARYDIR=$boost_root/lib"
          fi
          echo "-DENABLE_CONFIG_MODE_BOOST=OFF"
          echo "-DENABLE_STATIC_BOOST_LIBS=OFF"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - id: build
      uses: ecmwf/ci-infrastructure/actions/cmake-build@main
      with:
        package: ecflow
        cmake-prefix-path: ${{ inputs.cmake-prefix-path }}
        c-compiler: ${{ inputs.c-compiler }}
        cxx-compiler: ${{ inputs.cxx-compiler }}
        build-type: ${{ inputs.build-type }}
        cmake-args: ${{ steps.boost.outputs.cmake-args }}
