name: Build ecflow from source
description: >
  Configures, builds and installs the already-checked-out ecflow against the
  resolved dependency prefixes, and leaves the build tree in place. Caller must
  have already run actions/checkout@v6 in the same job — the action reads the
  source from $GITHUB_WORKSPACE.

  ecflow's tests link against the build tree rather than the install tree (and
  use static libraries that never reach the install prefix), so the build tree
  is an output and ctest must run against it in the same job.

inputs:
  cmake-prefix-path:
    description: 'Semicolon-separated prefixes of the resolved deps (ecbuild, stack-deps/pybind11)'
    required: true
  cxx-compiler:
    description: 'C++ compiler binary including version (e.g. g++-13)'
    required: true
  build-type:
    description: 'CMake build type (e.g. Release, Debug, RelWithDebInfo)'
    required: true

outputs:
  install-path:
    description: 'Absolute path where ecflow is installed'
    value: ${{ steps.set-paths.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree — ecflow tests run here, not from the install tree'
    value: ${{ steps.set-paths.outputs.build-dir }}

runs:
  using: composite
  steps:
    - name: Get install prefix
      id: prefix
      uses: ecmwf/ci-infrastructure/actions/install-prefix@main

    - name: Set paths
      id: set-paths
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "install-path=${{ steps.prefix.outputs.base }}/ecflow"
          echo "build-dir=$RUNNER_TEMP/_ecflow-build"
        } >> "$GITHUB_OUTPUT"

    - name: Configure ecflow
      shell: bash
      env:
        CMAKE_PREFIX_PATH_IN: ${{ inputs.cmake-prefix-path }}
        CXX_COMPILER: ${{ inputs.cxx-compiler }}
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_PATH: ${{ steps.set-paths.outputs.install-path }}
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      # Three flags carried over from ecflow's own .github/ci-config.yml, each
      # needed because the toolchain here is the distro's:
      #   BOOST_ROOT=/usr            cmake/Dependencies.cmake sets
      #                              Boost_NO_SYSTEM_PATHS=ON unconditionally, so
      #                              the apt-installed Boost is invisible without
      #                              an explicit root.
      #   ENABLE_CONFIG_MODE_BOOST=OFF
      #                              ubuntu 24.04 ships CMake 3.28, below the 3.30
      #                              that config mode targets, so use FindBoost.
      #   ENABLE_STATIC_BOOST_LIBS=OFF
      #                              link the shared Boost the distro packages.
      # OpenSSL (ENABLE_SSL, on by default) and pybind11 (ENABLE_PYTHON, likewise)
      # come from the base image and the stack-deps prefix respectively.
      run: |
        set -euo pipefail
        cmake -S "$GITHUB_WORKSPACE" \
              -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
              -DCMAKE_CXX_COMPILER="$CXX_COMPILER" \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PATH" \
              -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_IN" \
              -DBOOST_ROOT=/usr \
              -DENABLE_CONFIG_MODE_BOOST=OFF \
              -DENABLE_STATIC_BOOST_LIBS=OFF

    - name: Build and install ecflow
      shell: bash
      env:
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake --build "$BUILD_DIR" --parallel "$(nproc)"
        cmake --install "$BUILD_DIR"
