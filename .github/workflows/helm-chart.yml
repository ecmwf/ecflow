# Lints and renders the Helm chart of releng/ecflow-chart, with its defaults and with
# each profile of examples/, whenever the chart changes. Third-party actions are
# pinned to an immutable commit SHA; the tag beside each is a hint, not what is
# resolved.

name: Helm chart

on:
  push:
    paths:
      - releng/ecflow-chart/**
      - .github/workflows/helm-chart.yml
  pull_request:
    paths:
      - releng/ecflow-chart/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  lint:
    name: lint and render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: releng/ecflow-chart
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Fetch the dependencies
        run: helm dependency update

      - name: Lint with the defaults and with each profile
        run: |
          helm lint .
          for profile in examples/values-*.yaml; do
              echo "== ${profile}"
              helm lint . -f "${profile}"
          done

      - name: Render with each profile
        run: |
          for profile in examples/values-*.yaml; do
              echo "== ${profile}"
              helm template ecflow . -n ecflow -f "${profile}" > /dev/null
          done
