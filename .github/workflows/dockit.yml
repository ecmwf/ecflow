name: dockit

on:
  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:

  # Collect timestamp for docker image labelling
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest

    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      created: ${{ steps.timestamp.outputs.created }}
      jobs: ${{ steps.timestamp.outputs.jobs }}

    steps:
      - name: Collect timestamp
        id: timestamp
        run: |
          # The same instant, compact for image tags and in RFC 3339 for the OCI 'created' label
          now=$(date -u +%s)
          echo "timestamp=$(date -u -d "@${now}" +'%Y%m%dT%H%M%S')" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u -d "@${now}" +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
          echo "jobs=4" >> "${GITHUB_OUTPUT}"

  #
  # Create the ecflow package, per image variant and architecture
  # Each architecture is built natively, on a runner of that architecture
  #
  package:
    name: package (${{ matrix.image }}, ${{ matrix.arch }})
    needs: bootstrap
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-docker' }}

    runs-on: ${{ matrix.runner }}

    container:
      image: marcosbento/lumen:debian-13.7
      options: --user root

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux.gcc.server.release
        arch:
          - amd64
          - arm64
        include:
          - preset: linux.gcc.server.release
            image: ecflow-server-dev
            context: ecflow-server
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    outputs:
      version: ${{ steps.vars.outputs.version }}

    steps:

      - name: Display build context
        run: |
          echo "github.sha === ${{ github.sha }}"
          echo "github.ref === ${{ github.ref }}"
          echo "github.workspace === ${{ github.workspace }}"
          echo "GITHUB_WORKSPACE === ${GITHUB_WORKSPACE}"
          echo "runner.workspace === ${{ runner.workspace }}"
          echo "RUNNER_WORKSPACE === ${RUNNER_WORKSPACE}"
          echo "env === ${{ env }}"
          echo "Container user: $(whoami)"
          echo "Container working directory: $(pwd)"
          echo "Environment:"
          echo "$(env)"
          echo "OS info:"
          echo "$(cat /etc/os-release)"
          echo "CPU info:"
          echo "$(cat /proc/cpuinfo)"
          echo "Memory info:"
          echo "$(cat /proc/meminfo)"
          echo "Disk info:"
          echo "$(df -h)"


      - name: Checkout 'ecbuild'
        uses: actions/checkout@v4
        with:
          repository: ecmwf/ecbuild
          path: ecbuild

      - name: Checkout 'ecflow'
        uses: actions/checkout@v4
        with:
          path: ecflow

      - name: Generate ecflow custom version information
        id: vars
        run: |
          cd ${GITHUB_WORKSPACE}/ecflow
          version=$(cat CMakeLists.txt  | grep -e '^project' | sed 's/project( [a-zA-Z ]*\([0-9.]*\) )/\1/g')_${{ github.sha }}
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Configure ecflow
        id: configure-ecflow
        run: |
          cd ${GITHUB_WORKSPACE}/ecflow
          cmake --preset ${{ matrix.preset }} \
                -DCUSTOM_DEBIAN_PACKAGE_VERSION=${{ steps.vars.outputs.version }}

      - name: Build ecflow
        run: |
          cd ${GITHUB_WORKSPACE}/ecflow
          cmake --build \
                --preset ${{ matrix.preset }} \
                --jobs ${{ needs.bootstrap.outputs.jobs }} \
                --target all

      - name: Package ecflow
        run: |
          cd ${GITHUB_WORKSPACE}/ecflow
          cmake --build \
                --preset ${{ matrix.preset }} \
                --target package

      - name: Name ecflow debian package after its architecture
        run: |
          cd "${GITHUB_WORKSPACE}/ecflow/.deploy/build/${{ matrix.preset }}"
          for pkg in ecflow-*.deb; do
            cp "${pkg}" "${GITHUB_WORKSPACE}/ecflow-$(dpkg-deb --field "${pkg}" Architecture).deb"
          done

      - name: Upload ecflow debian package
        uses: actions/upload-artifact@v7
        with:
          name: ecflow-debian-package-${{ matrix.image }}-${{ matrix.arch }}
          path: ecflow-${{ matrix.arch }}.deb
          if-no-files-found: error

#      - name: Test ecflow
#        run: |
#          cd ${{ github.workspace }}/ecflow
#          ctest --preset  ${{ matrix.preset }} \
#                --jobs ${{ needs.bootstrap.outputs.jobs }} \
#                --output-on-failure \
#                -L nightly

  #
  # Create the ecflow docker image
  #
  dockerize:
    name: dockerize (${{ matrix.image }})
    needs: [ bootstrap, package ]

    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        preset:
          - linux.gcc.server.release
        include:
          - preset: linux.gcc.server.release
            image: ecflow-server-dev
            context: ecflow-server

    steps:
      - name: Checkout 'ecflow'
        uses: actions/checkout@v4
        with:
          path: ecflow

      - name: Download ecflow debian packages (all architectures)
        uses: actions/download-artifact@v7
        with:
          pattern: ecflow-debian-package-${{ matrix.image }}-*
          merge-multiple: true
          path: ecflow/releng/dockit/${{ matrix.context }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECCR_ECMWF_USER }}
          password: ${{ secrets.ECCR_ECMWF_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Smoke test Docker image (per platform)
        env:
          CONTEXT: ecflow/releng/dockit/${{ matrix.context }}
          # Upper bound on the uncompressed image size, well above the expected ~200 MB, but far below the
          # size of an image carrying debug information (over 1 GB), so that such a regression fails here
          MAX_IMAGE_SIZE_MB: 400
        run: |
          for platform in linux/amd64 linux/arm64; do
            tag="ecflow-smoke:${platform##*/}"
            docker buildx build --platform "${platform}" --load -t "${tag}" "${CONTEXT}"
            size=$(docker image inspect -f '{{.Size}}' "${tag}")
            size_mb=$(( size / 1000000 ))
            echo "${platform}: image size ${size_mb} MB (limit ${MAX_IMAGE_SIZE_MB} MB)"
            if [ "${size_mb}" -gt "${MAX_IMAGE_SIZE_MB}" ]; then
              echo "${platform}: image exceeds ${MAX_IMAGE_SIZE_MB} MB" >&2
              exit 1
            fi
            docker run -d --name ecflow-smoke --platform "${platform}" "${tag}"
            status=""
            for attempt in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' ecflow-smoke)
              [ "${status}" = "healthy" ] && break
              sleep 3
            done
            echo "${platform}: ${status} (after ${attempt} attempts)"
            if [ "${status}" != "healthy" ]; then
              docker logs ecflow-smoke
              exit 1
            fi
            docker stop ecflow-smoke
            docker rm ecflow-smoke
          done

      #
      # Tag the image after the branch it is built from:
      #   <branch-slug>_<short-sha>_<timestamp>_<version>  (this build)
      #   <branch-slug>                                    (the latest build of the branch)
      #   latest                                           (the latest build of develop only)
      # The slug drops the first component of the branch name, if any (e.g. 'task/'), lowercases it,
      # and replaces anything other than letters, digits and '.' with '-'; e.g. task/support_acl
      # becomes support-acl.
      #
      - name: Compute Docker image tags
        id: tags
        env:
          IMAGE: eccr.ecmwf.int/ecflow-dev-environments/${{ matrix.image }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TIMESTAMP: ${{ needs.bootstrap.outputs.timestamp }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          name="${BRANCH#*/}"
          slug=$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-60)
          slug="${slug%-}"
          if [ -z "${slug}" ]; then
            echo "Cannot derive an image tag from branch '${BRANCH}'" >&2
            exit 1
          fi
          # 'latest' is reserved for develop
          if [ "${slug}" = "latest" ] && [ "${BRANCH}" != "develop" ]; then
            echo "Branch '${BRANCH}' would be tagged 'latest', which is reserved for develop" >&2
            exit 1
          fi
          # VERSION is <project version>_<sha>; only the project version is used here
          tags="${IMAGE}:${slug}_${SHA:0:12}_${TIMESTAMP}_${VERSION%%_*}"$'\n'"${IMAGE}:${slug}"
          if [ "${BRANCH}" = "develop" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          echo "${tags}"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ecflow/releng/dockit/${{ matrix.context }}/Dockerfile
          context: ecflow/releng/dockit/${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.version }}
            org.opencontainers.image.created=${{ needs.bootstrap.outputs.created }}
            int.ecmwf.ecflow.preset=${{ matrix.preset }}
