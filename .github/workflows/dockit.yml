name: dockit

on:
  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:

  # Collect the timestamp, version and tag information shared by all jobs
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest

    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      created: ${{ steps.timestamp.outputs.created }}
      version: ${{ steps.vars.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout 'ecflow' (CMakeLists.txt and the package script only)
        uses: actions/checkout@v5
        with:
          path: ecflow
          sparse-checkout: |
            CMakeLists.txt
            releng/dockit/build_ecflow_package_in_container.sh
          sparse-checkout-cone-mode: false

      - name: Generate ecflow custom version information
        id: vars
        run: |
          version=$("${GITHUB_WORKSPACE}/ecflow/releng/dockit/build_ecflow_package_in_container.sh" \
                      --source "${GITHUB_WORKSPACE}/ecflow" --revision "${GITHUB_SHA}" --print-version)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Collect timestamp
        id: timestamp
        run: |
          # The same instant, compact for image tags and in RFC 3339 for the OCI 'created' label
          now=$(date -u +%s)
          {
            echo "timestamp=$(date -u -d "@${now}" +'%Y%m%dT%H%M%S')"
            echo "created=$(date -u -d "@${now}" +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      #
      # Tag every image after the branch it is built from, with the same tags:
      #   <branch-slug>_<short-sha>_<timestamp>_<version>  (this build)
      #   <branch-slug>                                    (the latest build of the branch)
      #   latest                                           (the latest build of develop only)
      # The slug drops the first component of the branch name, if any (e.g. 'task/'), lowercases it,
      # and replaces anything other than letters, digits and '.' with '-'; e.g. task/support_acl
      # becomes support-acl. The tags are given without an image name, one per line.
      #
      - name: Compute Docker image tags
        id: tags
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          name="${BRANCH#*/}"
          slug=$(printf '%s' "${name}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-60)
          slug="${slug%-}"
          if [ -z "${slug}" ]; then
            echo "Cannot derive an image tag from branch '${BRANCH}'" >&2
            exit 1
          fi
          # 'latest' is reserved for develop
          if [ "${slug}" = "latest" ] && [ "${BRANCH}" != "develop" ]; then
            echo "Branch '${BRANCH}' would be tagged 'latest', which is reserved for develop" >&2
            exit 1
          fi
          # VERSION is <project version>_<sha>; only the project version is used here
          tags="${slug}_${SHA:0:12}_${TIMESTAMP}_${VERSION%%_*}"$'\n'"${slug}"
          if [ "${BRANCH}" = "develop" ]; then
            tags="${tags}"$'\n'"latest"
          fi
          echo "${tags}"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  #
  # Create the ecflow package, per image variant and architecture
  # Each architecture is built natively, on a runner of that architecture, inside the build environment image, by
  # releng/dockit/build_ecflow_package_in_container.sh -- the same script build_ecflow_package.sh runs locally
  #
  package:
    name: package (${{ matrix.image }}, ${{ matrix.arch }})
    needs: bootstrap

    runs-on: ${{ matrix.runner }}

    container:
      image: marcosbento/lumen:debian-13.7
      options: --user root

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux.gcc.server.release
        arch:
          - amd64
          - arm64
        include:
          - preset: linux.gcc.server.release
            image: ecflow-server-dev
            context: ecflow-server
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:

      - name: Display build context
        run: |
          echo "Commit: ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          echo "Runner: ${RUNNER_OS} ${RUNNER_ARCH}; container user: $(whoami)"
          grep PRETTY_NAME /etc/os-release
          echo "CPUs: $(nproc)"
          grep MemTotal /proc/meminfo
          df -h "${GITHUB_WORKSPACE}"

      - name: Checkout 'ecflow'
        uses: actions/checkout@v5
        with:
          path: ecflow

      - name: Build ecflow debian package
        run: |
          "${GITHUB_WORKSPACE}/ecflow/releng/dockit/build_ecflow_package_in_container.sh" \
            --source "${GITHUB_WORKSPACE}/ecflow" \
            --preset "${{ matrix.preset }}" \
            --output-dir "${GITHUB_WORKSPACE}/packages"

      - name: Upload ecflow debian package
        uses: actions/upload-artifact@v7
        with:
          name: ecflow-debian-package-${{ matrix.image }}-${{ matrix.arch }}
          path: packages/ecflow-${{ matrix.arch }}.deb
          if-no-files-found: error

  #
  # Create the ecflow docker image
  #
  dockerize-ecflow:
    name: dockerize-ecflow (${{ matrix.image }})
    needs: [ bootstrap, package ]

    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        preset:
          - linux.gcc.server.release
        include:
          - preset: linux.gcc.server.release
            image: ecflow-server-dev
            context: ecflow-server

    steps:
      - name: Checkout 'ecflow'
        uses: actions/checkout@v5
        with:
          path: ecflow

      - name: Download ecflow debian packages (all architectures)
        uses: actions/download-artifact@v7
        with:
          pattern: ecflow-debian-package-${{ matrix.image }}-*
          merge-multiple: true
          path: ecflow/releng/dockit/${{ matrix.context }}

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECCR_ECMWF_USER }}
          password: ${{ secrets.ECCR_ECMWF_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create, smoke-test and push Docker image
        env:
          IMAGE: eccr.ecmwf.int/ecflow-dev-environments/${{ matrix.image }}
          TAGS: ${{ needs.bootstrap.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${IMAGE}:${tag}")
          done <<< "${TAGS}"
          "${GITHUB_WORKSPACE}/ecflow/releng/dockit/create_ecflow_docker_image.sh" \
            --context "${GITHUB_WORKSPACE}/ecflow/releng/dockit/${{ matrix.context }}" \
            --platform linux/amd64,linux/arm64 \
            --smoke-test \
            --push \
            "${args[@]}" \
            --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ needs.bootstrap.outputs.version }}" \
            --label "org.opencontainers.image.created=${{ needs.bootstrap.outputs.created }}" \
            --label "int.ecmwf.ecflow.preset=${{ matrix.preset }}"

  #
  # Create the images built directly from their Dockerfile, without an ecflow package: the reverse proxy and the SFTP
  # server of the ecflow deployments, with the same tags as the ecflow image
  #
  dockerize-standalone:
    name: dockerize-standalone (${{ matrix.image }})
    needs: bootstrap

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ecflow-revproxy-dev
            context: ecflow-revproxy
            # nginx, with the certificate generated at start, as no Secret is provided
            smoke: 'entrypoint: no certificate'
          - image: ecflow-sftp-dev
            context: ecflow-sftp
            # sshd, with an account and a temporary host key, as no keys are provided
            smoke: "entrypoint: created account 'dockit'"

    steps:
      - name: Checkout 'ecflow'
        uses: actions/checkout@v5
        with:
          path: ecflow

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: eccr.ecmwf.int
          username: ${{ secrets.ECCR_ECMWF_USER }}
          password: ${{ secrets.ECCR_ECMWF_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image of the runner's architecture is built, started and checked before any image is pushed
      - name: Smoke-test Docker image
        env:
          CONTEXT: ${{ github.workspace }}/ecflow/releng/dockit/${{ matrix.context }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          docker buildx build --load --tag smoke "${CONTEXT}"
          workspace=$(mktemp -d)
          container=$(docker run -d --env SFTP_USERS=dockit --volume "${workspace}:/workspace" smoke)
          sleep 5
          logs=$(docker logs "${container}" 2>&1)
          echo "${logs}"
          test "$(docker inspect -f '{{.State.Status}}' "${container}")" = running
          grep -qF "${SMOKE}" <<< "${logs}"
          docker rm -f "${container}" >/dev/null

      - name: Create and push Docker image
        env:
          CONTEXT: ${{ github.workspace }}/ecflow/releng/dockit/${{ matrix.context }}
          IMAGE: eccr.ecmwf.int/ecflow-dev-environments/${{ matrix.image }}
          TAGS: ${{ needs.bootstrap.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${IMAGE}:${tag}")
          done <<< "${TAGS}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            "${args[@]}" \
            --label "org.opencontainers.image.source=${{ github.repositoryUrl }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ needs.bootstrap.outputs.version }}" \
            --label "org.opencontainers.image.created=${{ needs.bootstrap.outputs.created }}" \
            "${CONTEXT}"
