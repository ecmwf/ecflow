name: old CI

on:
  # Trigger the workflow after the new CI succeeded on a push
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'main'
      - 'develop'

  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:
  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@main
    with:
      ci_group: only-self
      ecflow: ecmwf/ecflow@${{ github.event.workflow_run.head_sha || github.sha }}
      skip_matrix_jobs: |
        clang@macos-13-arm
      codecov_upload: true
      clang_format: true
      clang_format_ignore: |
        3rdparty
        docs
        tools
        releng
        libs/client/test/data
        libs/node/test/data
        libs/pyext/test/data
        libs/test/overall/data
    secrets: inherit

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@main
    with:
      ci_group: only-self
      ecflow: ecmwf/ecflow@${{ github.event.workflow_run.head_sha || github.sha }}
      skip_matrix_jobs: |
        intel-2021.4.0
        nvidia-22.11
        aocc-4.0.0
    secrets: inherit
